[health]
url = "https://example.com/health"
interval_seconds = 30
timeout_seconds = 10
failure_threshold = 2

[smtp]
host = "smtp.example.com"
port = 587
username = "replace-me"
password = "replace-me"
# starttls (usually port 587), implicit (usually port 465), or none
tls_mode = "starttls"
timeout_seconds = 10

[alerts]
from = "monitor@example.com"
to = ["you@example.com"]
